# Local / single-host stack.
#
#   cp .env.example .env                                   # add ANTHROPIC_API_KEY
#   docker compose -f deploy/docker-compose.yml up -d --build
#   docker compose -f deploy/docker-compose.yml --profile tools run --rm ingest
#
#   UI      http://localhost:8501        API  http://localhost:8000/docs
#   Traces  http://localhost:16686 (Jaeger). For Langfuse instead, run its official compose
#           (https://langfuse.com/self-hosting/docker-compose) and set LANGFUSE_HOST /
#           LANGFUSE_PUBLIC_KEY / LANGFUSE_SECRET_KEY in .env.

name: clinician-copilot

x-app: &app
  image: ${COPILOT_IMAGE:-clinician-copilot:dev}
  build:
    context: ..
    dockerfile: deploy/Dockerfile
  env_file:
    - path: ../.env
      required: false
  environment: &app-env
    QDRANT_URL: http://qdrant:6333
    POSTGRES_URL: postgresql://copilot:${POSTGRES_PASSWORD:-copilot}@postgres:5432/copilot
    OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://jaeger:4318}
    LOG_FORMAT: json
  read_only: true  # same as Kubernetes: writable only /tmp and mounted volumes
  tmpfs: [/tmp]
  restart: unless-stopped

services:
  api:
    <<: *app
    ports: ["8000:8000"]
    volumes:
      - app_storage:/app/storage
    depends_on:
      postgres: {condition: service_healthy}
      qdrant: {condition: service_started}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  ui:
    <<: *app
    command: ["streamlit", "run", "src/copilot/ui/app.py", "--server.port=8501",
              "--server.address=0.0.0.0", "--server.headless=true"]
    environment:
      <<: *app-env
      COPILOT_API_URL: http://api:8000
      HOME: /tmp
    ports: ["8501:8501"]
    depends_on:
      api: {condition: service_healthy}

  ingest:
    <<: *app
    profiles: [tools]
    restart: "no"
    command: ["sh", "-c", "python scripts/make_sample_care_pathway.py && python scripts/download_guidelines.py; python -m copilot.ingestion.cli ingest data/guidelines"]
    volumes:
      - guidelines:/app/data/guidelines
    depends_on:
      qdrant: {condition: service_started}

  qdrant:
    image: qdrant/qdrant:v1.19.2-unprivileged
    volumes:
      - qdrant_data:/qdrant/storage
    ports: ["127.0.0.1:6333:6333"]
    restart: unless-stopped

  postgres:
    image: postgres:17.10-alpine
    environment:
      POSTGRES_USER: copilot
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-copilot}
      POSTGRES_DB: copilot
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U copilot -d copilot"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  jaeger:
    image: jaegertracing/all-in-one:1.74.0
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports: ["127.0.0.1:16686:16686"]
    restart: unless-stopped

volumes:
  app_storage:
  guidelines:
  qdrant_data:
  postgres_data:
