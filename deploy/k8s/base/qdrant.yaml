# Single-node Qdrant. The index is derived data (rebuilt by the ingest job from versioned
# sources), so snapshots are for faster recovery, not the only copy. For HA, run Qdrant in
# distributed mode (replication_factor >= 2) or a managed cluster and point QDRANT_URL at it.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: qdrant
  labels: {app.kubernetes.io/name: qdrant, app.kubernetes.io/component: vector-store}
spec:
  serviceName: qdrant-headless
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: qdrant}
  template:
    metadata:
      labels: {app.kubernetes.io/name: qdrant, app.kubernetes.io/component: vector-store}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 2000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: qdrant
          image: qdrant/qdrant:v1.19.2-unprivileged
          ports:
            - {name: http, containerPort: 6333}
            - {name: grpc, containerPort: 6334}
          env:
            - {name: QDRANT__STORAGE__SNAPSHOTS_PATH, value: /qdrant/snapshots}
          resources:
            requests: {cpu: 250m, memory: 1Gi}
            limits: {cpu: "2", memory: 4Gi}
          readinessProbe:
            httpGet: {path: /readyz, port: http}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /livez, port: http}
            periodSeconds: 20
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: ["ALL"]}
          volumeMounts:
            - {name: data, mountPath: /qdrant/storage}
            - {name: snapshots, mountPath: /qdrant/snapshots}
  volumeClaimTemplates:
    - metadata: {name: data}
      spec:
        accessModes: [ReadWriteOnce]
        resources: {requests: {storage: 20Gi}}
    - metadata: {name: snapshots}
      spec:
        accessModes: [ReadWriteOnce]
        resources: {requests: {storage: 20Gi}}
---
apiVersion: v1
kind: Service
metadata:
  name: qdrant
  labels: {app.kubernetes.io/name: qdrant}
spec:
  selector: {app.kubernetes.io/name: qdrant}
  ports:
    - {name: http, port: 6333, targetPort: http}
    - {name: grpc, port: 6334, targetPort: grpc}
---
apiVersion: v1
kind: Service
metadata:
  name: qdrant-headless
  labels: {app.kubernetes.io/name: qdrant}
spec:
  clusterIP: None
  selector: {app.kubernetes.io/name: qdrant}
  ports:
    - {name: http, port: 6333, targetPort: http}
