[project]
name = "ai-clinician-copilot"
version = "0.1.0"
description = "RAG + agentic clinical decision support copilot"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pymupdf>=1.24",
    "python-docx>=1.1",
    "qdrant-client[fastembed]>=1.12",
    "tiktoken>=0.7",
    "typer>=0.12",
    "rich>=13.7",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "anthropic>=2.3.0",
    "langgraph>=1.2.17",
    "langgraph-checkpoint-postgres>=3.2.0",
    "psycopg[binary]>=3.3.6",
    "fastapi>=0.162.0",
    "uvicorn[standard]>=0.54.0",
    "mcp>=2.3.0",
    "presidio-analyzer>=2.2.365",
    "presidio-anonymizer>=2.2.365",
    "streamlit>=1.66.1",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=8.2",
    "ruff>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/copilot"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
extend-per-file-ignores = { "src/copilot/ingestion/cli.py" = ["B008"] }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
