name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:  # real persistence paths: LangGraph PostgresSaver + feedback table
        image: postgres:17.10-alpine
        env:
          POSTGRES_USER: copilot
          POSTGRES_PASSWORD: copilot
          POSTGRES_DB: copilot
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U copilot" --health-interval 5s
          --health-timeout 3s --health-retries 20
    env:
      TEST_POSTGRES_URL: postgresql://copilot:copilot@localhost:5432/copilot
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync
      - name: Lint
        run: uv run ruff check . && uv run ruff format --check .
      - name: Tests
        run: uv run pytest -q
      - name: Index the sample care pathway
        run: |
          uv run python scripts/make_sample_care_pathway.py
          uv run python -m copilot.ingestion.cli ingest data/guidelines
      - name: Evaluation gate
        # Deterministic agent checks + retrieval ablation; LLM suites run where a key is set.
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          suites=agent,retrieval
          if [ -n "$ANTHROPIC_API_KEY" ]; then suites=$suites,generation; fi
          uv run python eval/run_eval.py --suites "$suites" --gate eval/baseline.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-scorecard
          path: eval/reports/

  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate Kubernetes manifests (base + prod overlay)
        run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz | tar xz
          for target in deploy/k8s/base deploy/k8s/overlays/prod; do
            echo "== $target"
            kubectl kustomize "$target" | ./kubeconform -strict -summary \
              -kubernetes-version 1.31.0 \
              -schema-location default \
              -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json'
          done

      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          tags: clinician-copilot:ci
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Compose smoke test (no API key needed)
        env:
          COPILOT_IMAGE: clinician-copilot:ci
        run: |
          set -euo pipefail
          compose="docker compose -f deploy/docker-compose.yml"
          $compose up -d --no-build --wait --wait-timeout 300 api jaeger
          $compose --profile tools run --rm --no-deps ingest sh -c \
            "python scripts/make_sample_care_pathway.py && python -m copilot.ingestion.cli ingest data/guidelines"
          curl -fsS localhost:8000/ready
          # Off-topic question: retrieval + rerank run against Qdrant, then the
          # low-evidence refusal answers without calling the LLM.
          curl -fsS -X POST localhost:8000/chat -H 'content-type: application/json' \
            -d '{"question": "First-line inhaler for childhood asthma?"}' | tee chat.json
          python3 -c "import json; r = json.load(open('chat.json')); assert r['refusal_reason'] == 'low_evidence', r"
          thread=$(python3 -c "import json; print(json.load(open('chat.json'))['thread_id'])")
          test "$(curl -fsS localhost:8000/chat/$thread/history | python3 -c 'import json,sys; print(len(json.load(sys.stdin)))')" = 2
          curl -fsS -X POST localhost:8000/feedback -H 'content-type: application/json' \
            -d "{\"kind\": \"chat\", \"thread_id\": \"$thread\", \"rating\": \"up\"}"
          curl -fsS localhost:8000/feedback | grep -q "$thread"
          curl -fsS localhost:8000/metrics | grep -q 'copilot_answers_total{outcome="low_evidence"}'

      - name: Compose logs
        if: failure()
        run: docker compose -f deploy/docker-compose.yml logs --no-color
