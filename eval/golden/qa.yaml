# Golden Q&A set.
#
# Gold evidence is matched by doc_id + a phrase the relevant chunk must contain
# (case/whitespace-insensitive), so it survives re-chunking. Items whose gold documents are
# not in the index are skipped and reported.
#
# key_facts: regexes (case-insensitive) the answer must match; a cheap correctness check that
# runs without an LLM judge. expect: answer | refuse; refuse_reason pins the expected reason.
#
# Current items cover the synthetic sample care pathway (scripts/make_sample_care_pathway.py),
# whose text is known exactly. Add WHO/KDIGO items once those PDFs are indexed: use
# `run_eval.py --propose "<question>"` to list candidate chunks for annotation.

- id: dm-01
  question: When should metformin be stopped in a patient with CKD?
  expect: answer
  gold:
    - {doc_id: sample-care-pathway, contains: "stop metformin when eGFR falls below 30"}
  key_facts: ["below 30|< ?30", "dialysis"]
  reference: Stop metformin when eGFR falls below 30 ml/min/1.73m2 or the patient is on dialysis.

- id: dm-02
  question: What metformin dose adjustment is needed at an eGFR of 30-44?
  expect: answer
  gold:
    - {doc_id: sample-care-pathway, contains: "Reduce the metformin dose when eGFR is 30-44"}
  key_facts: ["reduce", "30.?44"]
  reference: Reduce the metformin dose when eGFR is 30-44 ml/min/1.73m2.

- id: dm-03
  question: At what kidney function can metformin be used as first-line therapy?
  expect: answer
  gold:
    - {doc_id: sample-care-pathway, contains: "metformin as first-line therapy when eGFR is 30"}
  key_facts: ["30", "first.line"]
  reference: Metformin is first-line therapy when eGFR is 30 ml/min/1.73m2 or above.

- id: dm-04
  question: How often should eGFR be monitored in a patient taking metformin?
  expect: answer
  gold:
    - {doc_id: sample-care-pathway, contains: "Monitor eGFR at least annually on metformin"}
  key_facts: ["annual|once a year|every year|yearly", "3.?(?:-|to|–).?6 months"]
  reference: At least annually, and every 3-6 months when eGFR is below 60 ml/min/1.73m2.

- id: dm-05
  question: What is the eGFR threshold for starting an SGLT2 inhibitor?
  expect: answer
  gold:
    - {doc_id: sample-care-pathway, contains: "Start an SGLT2 inhibitor for kidney and cardiovascular protection"}
  key_facts: ["20"]
  reference: Start an SGLT2 inhibitor when eGFR is 20 ml/min/1.73m2 or above.

- id: dm-06
  question: Should an SGLT2 inhibitor be started in CKD even if HbA1c is at target?
  expect: answer
  gold:
    - {doc_id: sample-care-pathway, contains: "irrespective of HbA1c"}
  key_facts: ["irrespective|regardless|independent", "kidney|renal|cardiovascular"]
  reference: Yes, for kidney and cardiovascular protection when eGFR >= 20, irrespective of HbA1c.

- id: dm-07
  question: What HbA1c target range applies to adults with type 2 diabetes and CKD?
  expect: answer
  gold:
    - {doc_id: sample-care-pathway, contains: "Individualise the HbA1c target"}
  key_facts: ["6\\.5", "8\\.0|8%"]
  reference: Individualised, from below 6.5% to below 8.0%.

- id: dm-08
  question: Which factors guide individualising the HbA1c target?
  expect: answer
  gold:
    - {doc_id: sample-care-pathway, contains: "hypoglycaemia risk, comorbidities, life expectancy"}
  key_facts: ["hypoglyc", "comorbid", "life expectancy", "preference"]
  reference: Hypoglycaemia risk, comorbidities, life expectancy and patient preference.

- id: dm-09
  question: How often should HbA1c be measured when a patient is at target and stable?
  expect: answer
  gold:
    - {doc_id: sample-care-pathway, contains: "Measure HbA1c twice a year"}
  key_facts: ["twice a year|two times a year|every 6 months|6.monthly"]
  reference: Twice a year.

- id: dm-10
  question: How frequently should HbA1c be checked after changing glucose-lowering therapy?
  expect: answer
  gold:
    - {doc_id: sample-care-pathway, contains: "up to four times a year"}
  key_facts: ["four times a year|4 times a year|every 3 months|quarterly"]
  reference: Up to four times a year when not at target or after a change in therapy.

- id: dm-11
  question: Can an SGLT2 inhibitor be started at an eGFR of 25?
  expect: answer
  gold:
    - {doc_id: sample-care-pathway, contains: "20-29 | Stop | Start"}
    - {doc_id: sample-care-pathway, contains: "Start an SGLT2 inhibitor for kidney and cardiovascular protection"}
  key_facts: ["yes|can be started|start"]
  reference: Yes; SGLT2 inhibitors can be started at eGFR 20 or above (20-29 band - start).

- id: dm-12
  question: What should happen to metformin and SGLT2 inhibitor therapy when eGFR drops below 20?
  expect: answer
  gold:
    - {doc_id: sample-care-pathway, contains: "<20 | Stop | Do not start"}
  key_facts: ["stop", "do not start|not be started|should not start"]
  reference: Stop metformin; do not start an SGLT2 inhibitor.

- id: dm-13
  question: Is metformin given at full dose when eGFR is 50?
  expect: answer
  gold:
    - {doc_id: sample-care-pathway, contains: "≥45 | Full dose | Start"}
  key_facts: ["full dose"]
  reference: Yes, full dose at eGFR 45 or above.

- id: dm-14
  question: Does the care pathway cover patients on dialysis taking metformin?
  expect: answer
  gold:
    - {doc_id: sample-care-pathway, contains: "or the patient is on dialysis"}
  key_facts: ["stop"]
  reference: Metformin should be stopped in patients on dialysis.

- id: htn-01
  question: What is the blood pressure target for adults with hypertension and no comorbidities?
  expect: answer
  gold:
    - {doc_id: sample-care-pathway, contains: "Target blood pressure below 140/90"}
  key_facts: ["140/90"]
  reference: Below 140/90 mmHg.

- id: htn-02
  question: What systolic target applies to patients with diabetes or CKD?
  expect: answer
  gold:
    - {doc_id: sample-care-pathway, contains: "Target systolic blood pressure below 130"}
  key_facts: ["130"]
  reference: Systolic below 130 mmHg.

- id: htn-03
  question: How often should patients be reviewed after starting antihypertensive medication?
  expect: answer
  gold:
    - {doc_id: sample-care-pathway, contains: "Review monthly after starting or changing antihypertensive"}
  key_facts: ["monthly|every month|each month"]
  reference: Monthly until the target is reached.

- id: htn-04
  question: Once blood pressure is at target, how often should it be reviewed?
  expect: answer
  gold:
    - {doc_id: sample-care-pathway, contains: "Once at target, review every 3-6 months"}
  key_facts: ["3.?(?:-|to|–).?6 months"]
  reference: Every 3-6 months.

- id: htn-05
  question: Which patients with hypertension need a lower systolic target than 140?
  expect: answer
  gold:
    - {doc_id: sample-care-pathway, contains: "known cardiovascular disease, diabetes, CKD or high cardiovascular risk"}
  key_facts: ["cardiovascular", "diabetes", "ckd|kidney"]
  reference: Known cardiovascular disease, diabetes, CKD or high cardiovascular risk (target < 130).

- id: mix-01
  question: For a patient with type 2 diabetes, CKD and hypertension, what BP target and kidney monitoring apply if eGFR is 40?
  expect: answer
  gold:
    - {doc_id: sample-care-pathway, contains: "Target systolic blood pressure below 130"}
    - {doc_id: sample-care-pathway, contains: "every 3-6 months when eGFR is below 60"}
  key_facts: ["130", "3.?(?:-|to|–).?6 months"]
  reference: Systolic below 130 mmHg; monitor eGFR every 3-6 months.

- id: mix-02
  question: Which adults does the primary care pathway apply to?
  expect: answer
  gold:
    - {doc_id: sample-care-pathway, contains: "This pathway covers adults in primary care"}
  key_facts: ["type 2 diabetes|diabetes", "hypertension"]
  reference: Adults in primary care with type 2 diabetes, hypertension or both, including CKD.

- id: mix-03
  question: How should glucose-lowering therapy change as eGFR falls from 45 to 25?
  expect: answer
  gold:
    - {doc_id: sample-care-pathway, contains: "30-44 | Reduce dose | Start"}
    - {doc_id: sample-care-pathway, contains: "20-29 | Stop | Start"}
  key_facts: ["reduce", "stop", "sglt2"]
  reference: Reduce metformin at 30-44, stop below 30; SGLT2 inhibitor can be started down to 20.

